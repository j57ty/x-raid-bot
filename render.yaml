services:
  - type: web
    name: x-raid-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TWITTER_AUTH_TOKEN
        sync: false
      - key: TWITTER_CT0
        sync: false
      - key: DEFAULT_SAMPLE_PERCENT
        value: "40"
      - key: MAX_LINKS_PER_MESSAGE
        value: "15"
      - key: DELETE_WARNING_AFTER_SECONDS
        value: "8"
      - key: PIN_RAID_MESSAGE
        value: "true"
      - key: TEST_MODE
        value: "false"
